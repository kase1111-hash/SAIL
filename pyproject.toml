[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sail"
version = "0.1.0"
description = "Situational Awareness Interaction Layer - A privacy-first, locally-hosted AI companion"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "SAIL Contributors" }
]
keywords = ["ai", "privacy", "local", "assistant", "safety"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Home Automation",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Core
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "aiofiles>=23.0",

    # LLM Integration
    "httpx>=0.25",
    "ollama>=0.1",

    # Voice I/O
    "numpy>=1.24",
    "sounddevice>=0.4",
    "webrtcvad>=2.0.10",

    # Utilities
    "structlog>=23.0",
    "click>=8.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "black>=23.0",
    "mypy>=1.5",
    "pre-commit>=3.4",
]

whisper = [
    "openai-whisper>=20231117",
    "faster-whisper>=0.9",
]

tts = [
    "piper-tts>=1.2",
]

wake = [
    "openwakeword>=0.5",
]

sensors = [
    "gpsd-py3>=0.3",
]

all = [
    "sail[whisper,tts,wake,sensors]",
]

[project.scripts]
sail = "sail.cli:main"

[project.urls]
Homepage = "https://github.com/sail-project/sail"
Documentation = "https://github.com/sail-project/sail#readme"
Repository = "https://github.com/sail-project/sail"
Issues = "https://github.com/sail-project/sail/issues"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate
    "PL",     # Pylint
    "RUF",    # Ruff-specific rules
]
ignore = [
    "PLR0913",  # Too many arguments
    "PLR2004",  # Magic value comparison
]

[tool.ruff.lint.isort]
known-first-party = ["sail"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "ollama.*",
    "sounddevice.*",
    "webrtcvad.*",
    "whisper.*",
    "piper.*",
    "openwakeword.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
